[package]
name = "penguin-masque"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "MASQUE: CONNECT-UDP поверх HTTP/3 (RFC 9298)"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-proto.workspace = true
# HTTP/3 с датаграммами.
penguin-transport = { workspace = true, features = ["quic"] }

# Проверка `:authority`.
http.workspace = true

tokio = { workspace = true, features = ["rt", "sync", "time"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
# Параметры приходят от `penguin-config` непрозрачным JSON.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
