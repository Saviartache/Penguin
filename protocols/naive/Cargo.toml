[package]
name = "penguin-naive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "NaiveProxy: CONNECT поверх HTTP/2 и HTTP/3 с дополнением трафика"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-proto.workspace = true
# `quic` — HTTP/3; `h2` — поток HTTP/2.
penguin-transport = { workspace = true, features = ["quic", "h2"] }

# CONNECT-туннель HTTP/2.
h2.workspace = true
http.workspace = true

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
# Параметры приходят от `penguin-config` непрозрачным JSON.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
