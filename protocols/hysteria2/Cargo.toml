[package]
name = "penguin-hysteria2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол Hysteria 2 поверх QUIC"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-proto.workspace = true

quinn = { workspace = true, features = ["rustls", "runtime-tokio"] }
quinn-proto.workspace = true
rustls = { workspace = true, features = ["ring", "std"] }
# TLS и срок рукопожатия; аутентификация — HTTP/3 (`quic`)
penguin-transport = { workspace = true, features = ["quic"] }

tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
blake2.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = ["obfs-salamander"]
obfs-salamander = []
# Дробление пакетов рукопожатия поверх Salamander
obfs-gecko = ["obfs-salamander"]
