[package]
name = "penguin-vless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол VLESS: опознание по UUID, шифрует транспорт"

[lints]
workspace = true

[dependencies]
# Протокол зависит только от контракта, общих типов и общего транспорта, плюс
# `penguin-utls` — крейт того же уровня (AGENTS.md §1.1.1), собирающий
# ClientHello для Reality.
penguin-core.workspace = true
penguin-proto.workspace = true
penguin-transport.workspace = true
penguin-utls.workspace = true

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
# Параметры протокола приходят от `penguin-config` непрозрачным JSON.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Ключевое расписание TLS 1.3, AEAD записи рукопожатия и HMAC-проверка
# сертификата Reality (`src/reality/`) — тот же провайдер, которым уже
# пользуется `penguin-transport` и сам `penguin-utls`.
ring.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
