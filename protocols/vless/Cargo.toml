[package]
name = "penguin-vless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол VLESS: опознание по UUID, шифрует транспорт"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-proto.workspace = true
# `h2` — gRPC, `quic` — XHTTP.
penguin-transport = { workspace = true, features = ["h2", "quic"] }
# ClientHello для Reality (§1.1.1).
penguin-utls.workspace = true

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# Расписание ключей TLS 1.3, AEAD записей и HMAC сертификата Reality.
ring.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
