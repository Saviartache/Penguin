[package]
name = "penguin-anytls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол AnyTLS: мультиплексор внутри TLS со своей схемой дополнения"

[lints]
workspace = true

[dependencies]
# Протокол зависит только от контракта, общих типов и общего транспорта.
penguin-core.workspace = true
penguin-proto.workspace = true
penguin-transport.workspace = true

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
# SHA-256 — опознание: пароль уходит отпечатком.
sha2.workspace = true
# MD5 — не защита, а имя схемы дополнения: сервер по нему решает, прислать ли
# свою. Заменить нечем — так считает сервер.
md-5.workspace = true
# Размеры записей разыгрываются: схема задаёт не число, а промежуток.
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
