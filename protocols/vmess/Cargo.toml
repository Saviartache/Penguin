[package]
name = "penguin-vmess"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол VMess: AEAD-заголовок, вложенный HMAC-KDF, шифрует сам"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-proto.workspace = true
# `h2` — gRPC, `quic` — XHTTP.
penguin-transport = { workspace = true, features = ["h2", "quic"] }

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# AEAD тела и заголовка.
ring.workspace = true
# Вложенный HMAC "VMess AEAD KDF": `ring::hmac` не принимает свою хеш-функцию.
sha2.workspace = true
# `cmdKey` и ключ ChaCha20 по протоколу.
md-5.workspace = true
# Один блок AES-ECB для опознавателя заголовка.
aes.workspace = true
# Shake128 для маски длины кадра; у `ring` его нет.
sha3.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
