[package]
name = "penguin-shadowsocks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол Shadowsocks: поток без заголовков, зашифрованный целиком"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-proto.workspace = true
penguin-transport.workspace = true

# Разовый AEAD с явным нонсом для UDP 2022 (AES-GCM).
ring.workspace = true
# Подключ 2022 выводится BLAKE3 `derive_key`, не HKDF.
blake3.workspace = true
# Заголовок UDP 2022 (AES-GCM) шифруется голым блоком AES на PSK.
aes.workspace = true
# UDP 2022 chacha: нонс 24 байта, у `ring` только 12.
chacha20poly1305.workspace = true

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
