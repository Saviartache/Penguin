[package]
name = "penguin-mieru"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол Mieru: своё мультиплексирование и обрамление сегментов поверх TCP"

[lints]
workspace = true

[dependencies]
# Протокол зависит только от контракта, общих типов и общего транспорта.
penguin-core.workspace = true
penguin-proto.workspace = true
penguin-transport.workspace = true

# XChaCha20-Poly1305 с 24-байтным нонсом — общий `aead` крейта транспорта
# рассчитан на 12 байт (AES-GCM, ChaCha20-Poly1305) и не подходит.
chacha20poly1305.workspace = true
# Вывод сеансового ключа: PBKDF2-HMAC-SHA256, как у эталона.
pbkdf2.workspace = true
sha2.workspace = true
rand.workspace = true

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }
