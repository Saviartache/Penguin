[package]
name = "penguin-tuic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол TUIC v5 поверх QUIC"

[lints]
workspace = true

[dependencies]
# Протокол зависит только от контракта, общих типов и общего транспорта.
penguin-core.workspace = true
penguin-proto.workspace = true
penguin-transport.workspace = true

quinn = { workspace = true, features = ["rustls", "runtime-tokio"] }
rustls = { workspace = true, features = ["ring", "std"] }

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
rand.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
