[package]
name = "penguin-dpi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Режим DPI: прямой выход, у которого первая посылка уходит по плану обхода"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-proto.workspace = true
# Ради `desync`: сам обход целиком лежит там и общий с `pingwin`.
penguin-transport.workspace = true

tokio = { workspace = true, features = ["rt", "net", "io-util", "time"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
# Параметры протокола приходят от `penguin-config` непрозрачным JSON —
# разбирает их только этот крейт.
serde_json.workspace = true
tracing.workspace = true
