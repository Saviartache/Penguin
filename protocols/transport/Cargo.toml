[package]
name = "penguin-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Общий транспорт протоколов: TLS, HTTP/3, HTTP/2, адреса, сроки"

[lints]
workspace = true

[dependencies]
# Уровень протоколов (AGENTS.md §1.1.1): только core и proto.
penguin-core.workspace = true
penguin-proto.workspace = true

rustls = { workspace = true, features = ["ring", "std"] }
rustls-platform-verifier.workspace = true
tokio-rustls.workspace = true
# Отпечатки сертификатов и шифры.
ring.workspace = true
# MD5 нужен для `EVP_BytesToKey` (`kdf`); в `ring` его нет.
md-5.workspace = true

# HTTP/3 и QUIC — фича `quic`.
quinn = { workspace = true, features = ["rustls", "runtime-tokio"], optional = true }
# HTTP/2 для gRPC и `CONNECT` — фича `h2`.
h2 = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# `net`: `desync` меняет TTL открытого `TcpStream`; сокеты открывает `Dialer`.
tokio = { workspace = true, features = ["rt", "io-util", "net", "time", "macros", "sync"] }
bytes.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
quic = ["dep:quinn"]
h2 = ["dep:h2", "dep:http"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }
# Чужой сервер HTTP/3 для `tests/h3.rs`.
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
async-trait.workspace = true
serde_json.workspace = true

[[test]]
name = "h3"
required-features = ["quic"]
