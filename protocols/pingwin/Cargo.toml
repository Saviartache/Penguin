[package]
name = "penguin-pingwin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол Pingwin: рукопожатие в форме TLS 1.3, 0-RTT, мультиплексор, обход DPI"

[lints]
workspace = true

[dependencies]
# Протокол зависит только от контракта, общих типов и крейтов своего уровня
# (AGENTS.md §1.1, §1.1.1). Ни одного крейта из `crates/`, кроме `core` и
# `proto`.
penguin-core.workspace = true
penguin-proto.workspace = true
penguin-transport.workspace = true
# Первая посылка — настоящий `ClientHello` с отпечатком браузера, и она же
# несёт эфемерный ключ в `key_share`. Собрать его иначе, чем этим крейтом,
# значило бы завести второй сборщик отпечатков.
penguin-utls.workspace = true

tokio = { workspace = true, features = ["rt", "io-util", "net", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
# Параметры протокола приходят от `penguin-config` непрозрачным JSON.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true
# HKDF-SHA256 ключевого расписания, SHA-256 стенограммы и AEAD записей — тот
# же провайдер, которым уже пользуются `penguin-transport` и `penguin-utls`.
ring.workspace = true
# Постоянный ключ сервера участвует в Диффи-Хеллмане на каждом соединении, а
# `ring::agreement` тратит закрытый ключ первым же согласованием. Тот же тип и
# по той же причине уже взяли `protocols/wireguard` и `penguin-utls`.
x25519-dalek.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "time"] }
