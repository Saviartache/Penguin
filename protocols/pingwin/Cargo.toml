[package]
name = "penguin-pingwin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол Pingwin: прокси поверх HTTP/3 или HTTP/2 с опознанием ключом X25519"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-proto.workspace = true
penguin-transport = { workspace = true, features = ["quic", "h2"] }

# Перенос по TCP, где UDP режут.
h2.workspace = true
http.workspace = true

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# HKDF-SHA256 опознания
ring.workspace = true
# Многоразовый секрет: `ring::agreement` тратит ключ
x25519-dalek.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
