[package]
name = "penguin-wireguard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "WireGuard: Noise IK поверх UDP, направление уровня пакетов"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-proto.workspace = true
penguin-transport.workspace = true

# Многоразовый секрет X25519 (`ring::agreement` его не даёт)
x25519-dalek.workspace = true
# HMAC-BLAKE2s собран вручную: `hmac` не работает с BLAKE2
blake2.workspace = true
chacha20poly1305.workspace = true

tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# `net` - только для поддельного сервера в `tests/loopback.rs`
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
