[package]
name = "penguin-trojan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Протокол Trojan: поток внутри TLS, неотличимый от обычного сайта"

[lints]
workspace = true

[dependencies]
# Протокол зависит только от контракта, общих типов и общего транспорта.
# Ни TUN, ни правил, ни GUI он не видит — это и делает его заменяемым.
penguin-core.workspace = true
penguin-proto.workspace = true
penguin-transport.workspace = true

tokio = { workspace = true, features = ["rt", "io-util", "sync", "time", "macros"] }
async-trait.workspace = true
bytes.workspace = true
# SHA-224 — единственная криптография протокола: пароль уходит её отпечатком.
sha2.workspace = true
serde.workspace = true
# Параметры протокола приходят от `penguin-config` непрозрачным JSON —
# разбирает их только этот крейт.
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util"] }
