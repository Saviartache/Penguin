[package]
name = "penguin-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Главный файл Penguin"

[lints]
workspace = true

# Имя файла, который получает пользователь. Один на все три роли: кем быть,
# программа решает по своим аргументам.
[[bin]]
name = "penguin"
path = "src/main.rs"

[dependencies]
penguin-config.workspace = true
penguin-platform.workspace = true
# Три роли одной программы. Крейт стоит выше всех и никем не подключается —
# стрелки вверх отсюда невозможны по построению.
penguin-cli.workspace = true
penguin-daemon.workspace = true
penguin-gui.workspace = true

clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# Иконка `penguin.exe`: ресурс собирает `build.rs`.
#
# Не за `cfg(windows)`: у сборочных зависимостей этот cfg означает машину, на
# которой собирают, а ресурс нужен там, где **цель** — Windows, с какой бы
# системы её ни собирали. Кого звать, решает `build.rs` по `CARGO_CFG_TARGET_OS`.
#
# `default-features = false` выключает разбор `Cargo.toml`: свойства файла
# задаются в `build.rs`, секции `package.metadata.winresource` у нас нет, а с
# умолчаниями крейт тянул бы второй `toml` в граф.
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(windows)'.dependencies]
# Только ради подключения к консоли родителя: повышение прав живёт в
# `platform`, у которого это и есть работа.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }
