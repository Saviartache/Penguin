[package]
name = "penguin-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Канал управления между GUI и демоном"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-config.workspace = true
# `Handler` вызывается через `dyn`.
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "net", "sync", "time", "macros"] }
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
# SDDL канала разбирается через `Win32_Security_Authorization`.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dependencies]
# `fs` — chown каталога канала.
nix = { workspace = true, features = ["user", "socket", "fs"] }
