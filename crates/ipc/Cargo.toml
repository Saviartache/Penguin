[package]
name = "penguin-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Канал управления между GUI и демоном"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-config.workspace = true
# `Handler` вызывается через `dyn`; без `async_trait` асинхронный метод
# трейта не выражается в объекте.
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec"] }
futures.workspace = true
bytes.workspace = true
interprocess.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Pipes"] }
# Дескриптор безопасности канала задаётся строкой SDDL в UTF-16.
widestring = "1"

[target.'cfg(unix)'.dependencies]
# `fs` — ради `chown`: каталог канала управления отдаётся группе
# администраторов, иначе окно под пользователем до службы не дотянется.
nix = { workspace = true, features = ["user", "socket", "fs"] }
