[package]
name = "penguin-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Управление Penguin из терминала"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-config.workspace = true
penguin-engine.workspace = true
penguin-inbound.workspace = true
penguin-router.workspace = true
penguin-process.workspace = true
penguin-dns.workspace = true
# Только ради `doctor`: он отвечает на вопрос «почему не работает», а
# ответ на него — состояние системы, а не клиента.
penguin-tun.workspace = true
penguin-platform.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-util.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[features]
# Набор протоколов задаётся движком; перечисление здесь нужно только затем,
# чтобы `--no-default-features` собирал клиент без единого протокола.
default = ["hysteria2"]
hysteria2 = ["penguin-engine/hysteria2"]
