[package]
name = "penguin-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Маршруты, брандмауэр и служба операционной системы"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
ipnet.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    # `NET_LUID_LH` в сигнатуре `GetBestRoute2` живёт здесь.
    "Win32_NetworkManagement_Ndis",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    # Действие брандмауэра по умолчанию — только через COM: разбирать
    # локализованный вывод `netsh` нельзя.
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_System_Com",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["net", "user"] }
