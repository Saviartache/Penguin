[package]
name = "penguin-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Окно Penguin на rust-ui-kit"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-config.workspace = true
penguin-ipc.workspace = true
# Автозапуск окна пишет в ветку пользователя; у службы прав на неё нет.
penguin-platform.workspace = true
# Пакет `rust-ui-kit`, библиотека `uikit`. `tray` на Linux требует libgtk-3-dev.
uikit = { workspace = true, features = ["tray"] }
# Без `tiny-skia`: в графе он оставляет прошлый кадр прямоугольниками. `crisp` и
# `web-colors` меняют рендер, `image` нужна `window::icon::from_file_data`,
# `tokio` — исполнитель (на пуле `tokio::time` паникует). `advanced` и
# `thread-pool` приносит кит.
iced = { workspace = true, features = [
    "wgpu",
    "crisp",
    "web-colors",
    "x11",
    "wayland",
    "tokio",
    "image",
] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
serde_json.workspace = true
tracing.workspace = true
# Разбор подсетей в правилах до сохранения.
ipnet.workspace = true
