[package]
name = "penguin-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Сборка тоннеля: входящие, маршрутизация, исходящие"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-config.workspace = true
penguin-proto.workspace = true
penguin-router.workspace = true
penguin-process.workspace = true
penguin-netstack.workspace = true
penguin-inbound.workspace = true
penguin-tun.workspace = true
penguin-dns.workspace = true
penguin-platform.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util.workspace = true
bytes.workspace = true
# Снимки счётчиков и истории уезжают в интерфейс через канал управления.
serde.workspace = true
# Параметры профиля непрозрачны для движка и передаются протоколу как есть.
serde_json.workspace = true
arc-swap.workspace = true
dashmap.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Протоколы подключаются здесь и только здесь — по фиче на протокол.
# Добавление второго протокола не трогает ни одной строки существующего кода:
# новая фича, новая строка зависимости, новая регистрация в реестре.
penguin-hysteria2 = { workspace = true, optional = true }
penguin-socks5 = { workspace = true, optional = true }
penguin-trojan = { workspace = true, optional = true }
penguin-shadowsocks = { workspace = true, optional = true }
penguin-vless = { workspace = true, optional = true }
penguin-tuic = { workspace = true, optional = true }
penguin-anytls = { workspace = true, optional = true }
penguin-juicity = { workspace = true, optional = true }
penguin-snell = { workspace = true, optional = true }
penguin-gost-relay = { workspace = true, optional = true }
penguin-brook = { workspace = true, optional = true }
penguin-http-proxy = { workspace = true, optional = true }

[features]
default = ["hysteria2", "tuic", "juicity", "anytls", "vless", "trojan", "shadowsocks", "snell", "gost-relay", "brook", "socks5", "http-proxy"]
hysteria2 = ["dep:penguin-hysteria2"]
socks5 = ["dep:penguin-socks5"]
trojan = ["dep:penguin-trojan"]
shadowsocks = ["dep:penguin-shadowsocks"]
vless = ["dep:penguin-vless"]
tuic = ["dep:penguin-tuic"]
anytls = ["dep:penguin-anytls"]
juicity = ["dep:penguin-juicity"]
snell = ["dep:penguin-snell"]
gost-relay = ["dep:penguin-gost-relay"]
brook = ["dep:penguin-brook"]
# Одна фича на два протокола: `http` и `https` — это один крейт и одна строка
# настройки; собрать половину крейта всё равно нельзя.
http-proxy = ["dep:penguin-http-proxy"]
