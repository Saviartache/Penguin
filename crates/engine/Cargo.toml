[package]
name = "penguin-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Сборка тоннеля: входящие, маршрутизация, исходящие"

[lints]
workspace = true

[dependencies]
penguin-core.workspace = true
penguin-config.workspace = true
penguin-proto.workspace = true
penguin-router.workspace = true
penguin-process.workspace = true
penguin-netstack.workspace = true
penguin-inbound.workspace = true
penguin-tun.workspace = true
penguin-dns.workspace = true
penguin-platform.workspace = true
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
arc-swap.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Протоколы подключаются здесь и только здесь — по фиче на протокол.
penguin-hysteria2 = { workspace = true, optional = true }
penguin-socks5 = { workspace = true, optional = true }
penguin-trojan = { workspace = true, optional = true }
penguin-shadowsocks = { workspace = true, optional = true }
penguin-vless = { workspace = true, optional = true }
penguin-vmess = { workspace = true, optional = true }
penguin-pingwin = { workspace = true, optional = true }
penguin-dpi = { workspace = true, optional = true }
penguin-tuic = { workspace = true, optional = true }
penguin-anytls = { workspace = true, optional = true }
penguin-juicity = { workspace = true, optional = true }
penguin-masque = { workspace = true, optional = true }
penguin-trusttunnel = { workspace = true, optional = true }
penguin-wireguard = { workspace = true, optional = true }
penguin-naive = { workspace = true, optional = true }

[features]
default = ["pingwin", "dpi", "hysteria2", "tuic", "juicity", "anytls", "vless", "vmess", "trojan", "shadowsocks", "naive", "masque", "wireguard", "trusttunnel", "socks5"]
pingwin = ["dep:penguin-pingwin"]
# Не протокол: обход DPI на прямом соединении.
dpi = ["dep:penguin-dpi"]
hysteria2 = ["dep:penguin-hysteria2"]
socks5 = ["dep:penguin-socks5"]
trojan = ["dep:penguin-trojan"]
shadowsocks = ["dep:penguin-shadowsocks"]
vless = ["dep:penguin-vless"]
vmess = ["dep:penguin-vmess"]
tuic = ["dep:penguin-tuic"]
anytls = ["dep:penguin-anytls"]
juicity = ["dep:penguin-juicity"]
naive = ["dep:penguin-naive"]
masque = ["dep:penguin-masque"]
wireguard = ["dep:penguin-wireguard"]
trusttunnel = ["dep:penguin-trusttunnel"]
