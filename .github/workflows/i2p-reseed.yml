# Узлы I2P для первого запуска i2pd (reseed) — в ветку `i2p-reseed`.
#
# Серверы reseed в РФ заблокированы, GitHub — нет: i2pd берёт `i2pseeds.su3`
# с raw.githubusercontent.com (`crates/i2pd/src/conf.rs`). Не из релиза: по
# перенаправлению GitHub на хранилище вложений i2pd 3.0.0 ходит по кругу.
# Узлы меняются, поэтому раз в сутки; ветка — один коммит, история не копится.
name: i2p-reseed

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: i2p-reseed

jobs:
  reseed:
    runs-on: ubuntu-latest
    steps:
      - name: su3
        run: |
          # Список — `reseed.urls` i2pd 3.0.0; первый ответивший.
          for host in reseed2.i2p.net reseed.stormycloud.org i2p.novg.net reseed.onion.im \
            reseed-fr.i2pd.xyz reseed.sahil.world www2.mk16.de coconut.incognet.io; do
            # Серверы отвечают только «wget» (так ходит и i2pd).
            if curl -fsSL --max-time 60 -A "Wget/1.11.4" -o i2pseeds.su3 "https://$host/i2pseeds.su3" \
              && [ "$(head -c 6 i2pseeds.su3)" = "I2Psu3" ]; then
              echo "узлы с $host: $(stat -c %s i2pseeds.su3) байт"
              exit 0
            fi
          done
          echo "ни один сервер reseed не ответил"
          exit 1

      - name: ветка
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir branch && mv i2pseeds.su3 branch/ && cd branch
          git init -q -b i2p-reseed
          git add i2pseeds.su3
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "i2p-reseed: $(date -u +%F)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" i2p-reseed
