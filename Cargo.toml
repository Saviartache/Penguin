# Penguin — VPN-клиент. Корень workspace. Раскладка — `docs/protocols.md`.

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/proto",
    "crates/match",
    "crates/router",
    "crates/process",
    "crates/tun",
    "crates/netstack",
    "crates/inbound",
    "crates/dns",
    "crates/platform",
    "crates/engine",
    "crates/ipc",
    "crates/daemon",
    "crates/gui",
    "crates/cli",
    "crates/app",
    "protocols/transport",
    "protocols/hysteria2",
    "protocols/anytls",
    "protocols/juicity",
    "protocols/snell",
    "protocols/gost-relay",
    "protocols/brook",
    "protocols/mieru",
    "protocols/naive",
    "protocols/shadowsocksr",
    "protocols/ssh",
    "protocols/utls",
    "protocols/tuic",
    "protocols/vless",
    "protocols/shadowsocks",
    "protocols/trojan",
    "protocols/socks5",
    "protocols/http-proxy",
]

# У кита свои `rustfmt.toml` и свои пороги clippy: в нашем workspace он
# проверялся бы нашими.
exclude = ["vendor/rust-ui-kit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Saviartache/penguin"
authors = ["Saviartache"]

[workspace.dependencies]
# --- внутренние ---
penguin-core     = { path = "crates/core" }
penguin-config   = { path = "crates/config" }
penguin-proto    = { path = "crates/proto" }
penguin-match    = { path = "crates/match" }
penguin-router   = { path = "crates/router" }
penguin-process  = { path = "crates/process" }
penguin-tun      = { path = "crates/tun" }
penguin-netstack = { path = "crates/netstack" }
penguin-inbound  = { path = "crates/inbound" }
penguin-dns      = { path = "crates/dns" }
penguin-platform = { path = "crates/platform" }
penguin-engine   = { path = "crates/engine" }
penguin-ipc      = { path = "crates/ipc" }
penguin-daemon   = { path = "crates/daemon" }
penguin-cli      = { path = "crates/cli" }
penguin-gui      = { path = "crates/gui" }
penguin-transport = { path = "protocols/transport" }
penguin-anytls = { path = "protocols/anytls" }
penguin-juicity = { path = "protocols/juicity" }
penguin-snell = { path = "protocols/snell" }
penguin-gost-relay = { path = "protocols/gost-relay" }
penguin-brook = { path = "protocols/brook" }
penguin-mieru = { path = "protocols/mieru" }
penguin-naive = { path = "protocols/naive" }
penguin-shadowsocksr = { path = "protocols/shadowsocksr" }
penguin-ssh = { path = "protocols/ssh" }
penguin-utls = { path = "protocols/utls" }
penguin-hysteria2 = { path = "protocols/hysteria2" }
penguin-tuic = { path = "protocols/tuic" }
penguin-vless = { path = "protocols/vless" }
penguin-shadowsocks = { path = "protocols/shadowsocks" }
penguin-trojan = { path = "protocols/trojan" }
penguin-socks5 = { path = "protocols/socks5" }
penguin-http-proxy = { path = "protocols/http-proxy" }

# --- UI ---
uikit = { package = "rust-ui-kit", path = "vendor/rust-ui-kit" }
iced = { version = "0.14", default-features = false }

# --- асинхронность ---
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
async-trait = "0.1"

# --- транспорт ---
quinn = { version = "0.11", default-features = false }
quinn-proto = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = "0.5"
rustls-pemfile = "2"
# Уже в дереве: его тянет `rustls` с фичей `ring`. Протоколам он даёт
# AES-GCM, ChaCha20-Poly1305, HKDF, HMAC и X25519 — то есть почти всю
# криптографию плана, не добавляя к сборке ничего нового.
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false }
http = "1"
# Только ради `naive`: CONNECT поверх HTTP/2. Остальным протоколам он не
# нужен — HTTP/2 в проекте есть только затем, чтобы NaiveProxy маскировался
# под обычный веб-трафик.
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
smoltcp = { version = "0.12", default-features = false }
# Своей реализации SSH не будет — обмен ключами, шифры, опознание и каналы
# отдельный проект. Бэкенд и алгоритмы выбираются в `protocols/ssh`, чтобы не
# тащить сюда второй криптографический бэкенд по умолчанию.
russh = { version = "0.63", default-features = false }

# --- данные ---
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
bytes = "1"

# --- сопоставление ---
ipnet = "2"
aho-corasick = "1"
regex = "1"
globset = "0.4"
maxminddb = "0.24"

# --- криптография ---
blake2 = "0.10"
sha2 = "0.10"
# Только ради `EVP_BytesToKey` — вывода ключа из пароля у Shadowsocks. Своей
# стойкости он не даёт и придуман не для этого; заменить его нельзя, потому
# что так делает сервер.
md-5 = "0.10"
# Только ради Snell: сеансовый ключ он выводит Argon2id прямо из пароля, и
# другой функции у него нет. Своей реализации Argon2 в проекте не будет —
# это примитив, который либо берут готовым, либо ошибаются в нём молча.
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
rand = "0.8"
# Только ради ShadowsocksR: там все шифры потоковые, а в `ring` (AEAD) их
# нет. Данные ими не заверяются — это свойство протокола, не наше решение
# (см. документ крейта `penguin-shadowsocksr`).
aes = "0.9"
cfb-mode = "0.9"
ctr = "0.10"
rc4 = "0.2"
sha1 = "0.10"
# Версия закреплена на `0.10.x` в дереве `digest`, чтобы совпасть с `md-5` и
# `sha1`, которые уже в этой версии, — иначе `Hmac<Md5>` не собрать: более
# новый `hmac` требует `digest 0.11` и другого типажа (`EagerHash`).
hmac = "0.12"
# Только ради Mieru: нонс XChaCha20-Poly1305 — 24 байта, вдвое длиннее того,
# что умеет общий `aead` (у `ring` XChaCha20 нет вовсе).
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
# Только ради Mieru: сеансовый ключ выводится PBKDF2-HMAC-SHA256 из хэша
# пароля с именем пользователя и соли, зависящей от времени.
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }

# --- DNS ---
hickory-proto = { version = "0.24", default-features = false }

# --- служебное ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
dashmap = "6"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
interprocess = { version = "2", features = ["tokio"] }
widestring = "1"

# --- платформа ---
windows = "0.58"
windows-service = "0.7"
wintun = "0.5"

nix = { version = "0.29", default-features = false }
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "warn"          # разрешено только в `platform`/`process`/`tun`
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
