# Penguin — VPN-клиент. Корень workspace. Раскладка — `AGENTS.md` §1.

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/proto",
    "crates/match",
    "crates/router",
    "crates/process",
    "crates/tun",
    "crates/netstack",
    "crates/inbound",
    "crates/dns",
    "crates/platform",
    "crates/update",
    "crates/engine",
    "crates/ipc",
    "crates/subscription",
    "crates/daemon",
    "crates/gui",
    "crates/cli",
    "crates/app",
    "protocols/transport",
    "protocols/dpi",
    "protocols/hysteria2",
    "protocols/anytls",
    "protocols/juicity",
    "protocols/masque",
    "protocols/naive",
    "protocols/trusttunnel",
    "protocols/utls",
    "protocols/wireguard",
    "protocols/tuic",
    "protocols/vless",
    "protocols/vmess",
    "protocols/pingwin",
    "protocols/shadowsocks",
    "protocols/trojan",
    "protocols/socks5",
    "servers/pingwin",
]

# У кита свои `rustfmt.toml` и пороги clippy.
exclude = ["vendor/rust-ui-kit"]

[workspace.package]
version = "0.8.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Saviartache/penguin"
authors = ["Saviartache"]

[workspace.dependencies]
# --- внутренние ---
penguin-core     = { path = "crates/core" }
penguin-config   = { path = "crates/config" }
penguin-proto    = { path = "crates/proto" }
penguin-match    = { path = "crates/match" }
penguin-router   = { path = "crates/router" }
penguin-process  = { path = "crates/process" }
penguin-tun      = { path = "crates/tun" }
penguin-netstack = { path = "crates/netstack" }
penguin-inbound  = { path = "crates/inbound" }
penguin-dns      = { path = "crates/dns" }
penguin-platform = { path = "crates/platform" }
# Без сети окно получает одни типы; сеть включается по умолчанию.
penguin-update   = { path = "crates/update", default-features = false }
# Без этого умолчания движка возвращают все протоколы демону и клиенту.
penguin-engine   = { path = "crates/engine", default-features = false }
penguin-ipc      = { path = "crates/ipc" }
penguin-subscription = { path = "crates/subscription" }
penguin-daemon   = { path = "crates/daemon" }
penguin-cli      = { path = "crates/cli" }
penguin-gui      = { path = "crates/gui" }
penguin-transport = { path = "protocols/transport" }
penguin-dpi = { path = "protocols/dpi" }
penguin-anytls = { path = "protocols/anytls" }
penguin-juicity = { path = "protocols/juicity" }
penguin-masque = { path = "protocols/masque" }
penguin-naive = { path = "protocols/naive" }
penguin-trusttunnel = { path = "protocols/trusttunnel" }
penguin-utls = { path = "protocols/utls" }
penguin-wireguard = { path = "protocols/wireguard" }
penguin-hysteria2 = { path = "protocols/hysteria2" }
penguin-tuic = { path = "protocols/tuic" }
penguin-vless = { path = "protocols/vless" }
penguin-vmess = { path = "protocols/vmess" }
penguin-pingwin = { path = "protocols/pingwin" }
penguin-shadowsocks = { path = "protocols/shadowsocks" }
penguin-trojan = { path = "protocols/trojan" }
penguin-socks5 = { path = "protocols/socks5" }

# --- UI ---
uikit = { package = "rust-ui-kit", path = "vendor/rust-ui-kit" }
iced = { version = "0.14", default-features = false }

# --- асинхронность ---
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
async-trait = "0.1"

# --- транспорт ---
quinn = { version = "0.11", default-features = false }
quinn-proto = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = "0.5"
# Уже в дереве через `rustls`: AEAD, HKDF, HMAC, X25519.
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false }
http = "1"
# HTTP/2-маскировка NaiveProxy и TrustTunnel.
h2 = "0.4"
# Только сервер и тесты: клиентский HTTP/3 свой (`penguin_transport::h3`).
h3 = "0.0.8"
h3-quinn = "0.0.10"
smoltcp = { version = "0.12", default-features = false }
# Проверка обновлений: блокирующий клиент, TLS — `rustls`/`ring` из дерева.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# Уже в дереве через `png`; здесь — разворот deflate в zip и tar.gz.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# --- данные ---
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
bytes = "1"

# --- сопоставление ---
ipnet = "2"
aho-corasick = "1"
regex = "1"
maxminddb = "0.24"

# --- криптография ---
# RustCrypto — одно поколение `digest 0.11`: типажи 0.10 и 0.11 несовместимы.
blake2 = "0.11"
# BLAKE3 `derive_key` у Shadowsocks 2022.
blake3 = { version = "1", default-features = false }
sha2 = "0.11"
# Shake128 у VMess; в `0.12` его убрали.
sha3 = { version = "=0.11", default-features = false }
# `EVP_BytesToKey` у Shadowsocks и VMess — так делает сервер.
md-5 = "0.11"
# Уже в дереве через `quinn-proto`; обёртка — `penguin_proto::random`.
getrandom = "0.4"
# Многоразовый X25519-секрет для Noise IK у WireGuard; `ring` его потребляет.
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "getrandom"] }
# Голый блок AES у Shadowsocks 2022 и VMess.
aes = "0.9"
# Конверт шлюза подписки Amnezia: AES-256-CBC и RSA PKCS#1 v1.5.
cbc = { version = "0.2", features = ["alloc", "block-padding"] }
rsa = "0.9"
# RNG для RSA (OsRng); X25519 и AES берут байты из `getrandom` напрямую.
rand = "0.8"
# XChaCha20-Poly1305: в `ring` нет.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
# Голый ChaCha20 защиты заголовков AmneziaWG 3; та же версия, что внутри `chacha20poly1305`.
chacha20 = "0.10"

# --- служебное ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
arc-swap = "1"

# --- платформа ---
windows = "0.58"
windows-service = "0.7"
wintun = "0.5"

nix = { version = "0.31", default-features = false }
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "warn"          # разрешено только в `platform`/`process`/`tun` и канале Windows у `ipc`
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
