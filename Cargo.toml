# Penguin — VPN-клиент. Корень workspace. Раскладка — `AGENTS.md` §1.

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/config",
    "crates/proto",
    "crates/match",
    "crates/router",
    "crates/process",
    "crates/tun",
    "crates/netstack",
    "crates/inbound",
    "crates/dns",
    "crates/platform",
    "crates/engine",
    "crates/ipc",
    "crates/daemon",
    "crates/gui",
    "crates/cli",
    "crates/app",
    "protocols/transport",
    "protocols/hysteria2",
    "protocols/anytls",
    "protocols/juicity",
    "protocols/masque",
    "protocols/naive",
    "protocols/openconnect",
    "protocols/trusttunnel",
    "protocols/utls",
    "protocols/wireguard",
    "protocols/tuic",
    "protocols/vless",
    "protocols/vmess",
    "protocols/pingwin",
    "protocols/shadowsocks",
    "protocols/trojan",
    "protocols/socks5",
    "protocols/http-proxy",
    "servers/pingwin",
]

# У кита свои `rustfmt.toml` и свои пороги clippy: в нашем workspace он
# проверялся бы нашими.
exclude = ["vendor/rust-ui-kit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Saviartache/penguin"
authors = ["Saviartache"]

[workspace.dependencies]
# --- внутренние ---
penguin-core     = { path = "crates/core" }
penguin-config   = { path = "crates/config" }
penguin-proto    = { path = "crates/proto" }
penguin-match    = { path = "crates/match" }
penguin-router   = { path = "crates/router" }
penguin-process  = { path = "crates/process" }
penguin-tun      = { path = "crates/tun" }
penguin-netstack = { path = "crates/netstack" }
penguin-inbound  = { path = "crates/inbound" }
penguin-dns      = { path = "crates/dns" }
penguin-platform = { path = "crates/platform" }
# `default-features = false` здесь несёт весь смысл списков фич у демона и
# клиента. Без него движок приходит к ним со своими умолчаниями — а в них
# все протоколы сразу, и `--no-default-features` перестаёт значить что-либо:
# собирается тот же бинарник до байта. Мерено, а не предположено.
penguin-engine   = { path = "crates/engine", default-features = false }
penguin-ipc      = { path = "crates/ipc" }
penguin-daemon   = { path = "crates/daemon" }
penguin-cli      = { path = "crates/cli" }
penguin-gui      = { path = "crates/gui" }
penguin-transport = { path = "protocols/transport" }
penguin-anytls = { path = "protocols/anytls" }
penguin-juicity = { path = "protocols/juicity" }
penguin-masque = { path = "protocols/masque" }
penguin-naive = { path = "protocols/naive" }
penguin-openconnect = { path = "protocols/openconnect" }
penguin-trusttunnel = { path = "protocols/trusttunnel" }
penguin-utls = { path = "protocols/utls" }
penguin-wireguard = { path = "protocols/wireguard" }
penguin-hysteria2 = { path = "protocols/hysteria2" }
penguin-tuic = { path = "protocols/tuic" }
penguin-vless = { path = "protocols/vless" }
penguin-vmess = { path = "protocols/vmess" }
penguin-pingwin = { path = "protocols/pingwin" }
penguin-shadowsocks = { path = "protocols/shadowsocks" }
penguin-trojan = { path = "protocols/trojan" }
penguin-socks5 = { path = "protocols/socks5" }
penguin-http-proxy = { path = "protocols/http-proxy" }

# --- UI ---
uikit = { package = "rust-ui-kit", path = "vendor/rust-ui-kit" }
iced = { version = "0.14", default-features = false }

# --- асинхронность ---
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
async-trait = "0.1"

# --- транспорт ---
quinn = { version = "0.11", default-features = false }
quinn-proto = { version = "0.11", default-features = false }
rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = "0.5"
rustls-pemfile = "2"
# Уже в дереве: его тянет `rustls` с фичей `ring`. Протоколам он даёт
# AES-GCM, ChaCha20-Poly1305, HKDF, HMAC и X25519 — то есть почти всю
# криптографию плана, не добавляя к сборке ничего нового.
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false }
http = "1"
# Только ради `naive`: CONNECT поверх HTTP/2. Остальным протоколам он не
# нужен — HTTP/2 в проекте есть только затем, чтобы NaiveProxy маскировался
# под обычный веб-трафик.
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
smoltcp = { version = "0.12", default-features = false }

# Только ради OpenConnect: опознание на сервере ocserv устроено как обмен
# HTTPS-запросами с телом XML. Свой разбор XML — это либо утиный разбор
# строк, который молча ломается на первом же CDATA, либо копия этого
# крейта, написанная хуже.
quick-xml = "0.42"

# --- данные ---
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
bytes = "1"

# --- сопоставление ---
ipnet = "2"
aho-corasick = "1"
regex = "1"
globset = "0.4"
maxminddb = "0.24"

# --- криптография ---
#
# Вся семья RustCrypto держится на одном поколении `digest 0.11` (`cipher 0.5`,
# `aead 0.6`). Смешивать поколения нельзя не из аккуратности: типажи `Digest`,
# `Mac` и `KeyInit` у 0.10 и 0.11 разные, `Hmac<Md5>` через границу поколений
# не собирается, и каждая половина тянет в дерево свою копию `digest`,
# `block-buffer`, `crypto-common` и `generic-array`.
blake2 = "0.11"
# Только ради Shadowsocks 2022: ключи и подключи там выводятся BLAKE3 в режиме
# `derive_key`, и другой функции вывода у метода нет. В `ring` его нет.
blake3 = { version = "1", default-features = false }
sha2 = "0.11"
# Только ради VMess: маскировка длины кадра тела — это XOF Shake128,
# которого нет ни у `ring`, ни у остальной уже подключённой криптографии.
# Зафиксировано на `0.11`: в `0.12` `Shake128`/`Shake128Reader` из крейта
# убраны (сверено с исходником `sha3` на crates.io), а именно они здесь и
# нужны.
sha3 = { version = "=0.11", default-features = false }
# Только ради `EVP_BytesToKey` — вывода ключа из пароля у Shadowsocks. Своей
# стойкости он не даёт и придуман не для этого; заменить его нельзя, потому
# что так делает сервер.
md-5 = "0.11"
rand = "0.8"
# Только ради WireGuard: постоянный приватный ключ участвует в каждом
# рукопожатии за весь сеанс, а `ring::agreement` потребляет его при первом же
# использовании. `static_secrets` даёт многоразовый секрет — он же нужен и для
# одноразового ключа рукопожатия, который в одном сеансе Noise IK участвует в
# двух разных вычислениях Диффи-Хеллмана.
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "getrandom"] }
# Голый блочный AES: заголовок сессии у Shadowsocks 2022 и опознаватель
# VMess шифруются одним блоком без режима сцепления, а `ring` даёт только
# AEAD.
aes = "0.9"
# XChaCha20-Poly1305: нонс 24 байта, вдвое длиннее того, что умеет общий
# `aead` (у `ring` XChaCha20 нет вовсе). Нужен датаграммам Shadowsocks 2022 и
# WireGuard.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }

# --- DNS ---
hickory-proto = { version = "0.24", default-features = false }

# --- служебное ---
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
dashmap = "6"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
interprocess = { version = "2", features = ["tokio"] }
widestring = "1"

# --- платформа ---
windows = "0.58"
windows-service = "0.7"
wintun = "0.5"

nix = { version = "0.31", default-features = false }
libc = "0.2"

[workspace.lints.rust]
unsafe_code = "warn"          # разрешено только в `platform`/`process`/`tun`
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev.package."*"]
opt-level = 2
