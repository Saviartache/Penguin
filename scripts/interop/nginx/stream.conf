# TLS перед обычным SOCKS5 — ровно то, чем и является `socks5-tls`: сам
# протокол про TLS не знает, его снимает то, что стоит перед прокси.
#
# Отдельного сервера для него нет и быть не может: `socks5-tls` — это не другой
# протокол на той стороне, а тот же SOCKS5 под чужой обёрткой.

events {}

stream {
    server {
        listen 1443 ssl;

        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_pass socks5:1080;
    }
}
