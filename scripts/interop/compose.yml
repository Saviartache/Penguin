# Эталонные серверы для проверки протоколов.
#
# Задача этих контейнеров — быть чужой реализацией. Тест на записанных байтах
# ловит ошибку в кадре, но не ловит ошибку в понимании протокола: свой разбор
# согласится сам с собой при любой ошибке в номерах и порядке полей.
#
# Поднимается вручную (`./run.sh`), а не из `check.sh`: тянуть образы на каждый
# коммит незачем.

services:
  # Куда ходит проверка. Свой, а не сайт в сети: проверяется протокол, и
  # падение чужого сайта не должно выглядеть падением протокола.
  target:
    image: nginx:alpine
    volumes:
      - ./target:/usr/share/nginx/html:ro
    networks: [interop]

  socks5:
    image: serjs/go-socks5-proxy
    environment:
      PROXY_USER: penguin
      PROXY_PASSWORD: secret
    ports:
      - "127.0.0.1:11080:1080"
    networks: [interop]

  # Без пароля: `AuthUnsupported` и `AuthRejected` — разные ошибки, и
  # проверять их надо о разные серверы.
  socks5-open:
    image: serjs/go-socks5-proxy
    # Образ требует пароль по умолчанию и без него не запускается вовсе.
    environment:
      REQUIRE_AUTH: "false"
    ports:
      - "127.0.0.1:11081:1080"
    networks: [interop]

  # TLS перед обычным SOCKS5. Отдельного сервера у `socks5-tls` нет: это тот же
  # SOCKS5, и обёртку снимает то, что стоит перед ним, — здесь nginx.
  socks5-tls:
    image: nginx:alpine
    volumes:
      - ./nginx/stream.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/tls:ro
    ports:
      - "127.0.0.1:11443:1443"
    depends_on: [socks5]
    networks: [interop]

  # Не tinyproxy: образ `vimagick/tinyproxy` падает от подключения, закрытого
  # до первой строки запроса, — эталоном такой сервер быть не может.
  http:
    image: gogost/gost
    command: -L http://:8888
    ports:
      - "127.0.0.1:18888:8888"
    networks: [interop]

  # sing-box в роли сервера. Он умеет почти все протоколы плана, поэтому
  # следующие фазы добавляют сюда файл настроек, а не новый образ.
  trojan:
    image: ghcr.io/sagernet/sing-box
    command: run -c /etc/sing-box/config.json
    volumes:
      - ./singbox/trojan.json:/etc/sing-box/config.json:ro
      - ./tls:/etc/sing-box/tls:ro
    ports:
      - "127.0.0.1:14431:443"
    networks: [interop]

  tuic:
    image: ghcr.io/sagernet/sing-box
    command: run -c /etc/sing-box/config.json
    volumes:
      - ./singbox/tuic.json:/etc/sing-box/config.json:ro
      - ./tls:/etc/sing-box/tls:ro
    ports:
      - "127.0.0.1:14433:443/udp"
    networks: [interop]

  vless:
    image: ghcr.io/sagernet/sing-box
    command: run -c /etc/sing-box/config.json
    volumes:
      - ./singbox/vless.json:/etc/sing-box/config.json:ro
      - ./tls:/etc/sing-box/tls:ro
    ports:
      - "127.0.0.1:14432:443"
    networks: [interop]

  # Схема дополнения не задана нарочно: у сервера она тогда та же, что у
  # клиента по умолчанию, и `cmdUpdatePaddingScheme` не приходит. Приём новой
  # схемы проверяется тестами — по сети он ничего видимого не меняет.
  anytls:
    image: ghcr.io/sagernet/sing-box
    command: run -c /etc/sing-box/config.json
    volumes:
      - ./singbox/anytls.json:/etc/sing-box/config.json:ro
      - ./tls:/etc/sing-box/tls:ro
    ports:
      - "127.0.0.1:14434:443"
    networks: [interop]

  shadowsocks:
    image: ghcr.io/sagernet/sing-box
    command: run -c /etc/sing-box/config.json
    volumes:
      - ./singbox/shadowsocks.json:/etc/sing-box/config.json:ro
    ports:
      - "127.0.0.1:18388:8388"
      - "127.0.0.1:18388:8388/udp"
    networks: [interop]

  # Своя сборка: сервер NaiveProxy — это Caddy с форком плагина, готового
  # образа нет.
  naive:
    build: ./naive
    volumes:
      - ./naive/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./tls:/etc/caddy/tls:ro
    ports:
      - "127.0.0.1:14436:443"
    networks: [interop]

  # Свой образ, а не sing-box: Juicity тот не умеет. Порт по UDP — под ним
  # QUIC, и проброс TCP здесь не значил бы ничего.
  juicity:
    image: ghcr.io/juicity/juicity:main
    volumes:
      - ./juicity/server.json:/etc/juicity/server.json:ro
      - ./tls:/etc/juicity/tls:ro
    ports:
      - "127.0.0.1:14435:443/udp"
    networks: [interop]

  hysteria2:
    image: tobyxdd/hysteria
    command: server -c /etc/hysteria/config.yaml
    volumes:
      - ./hysteria2/config.yaml:/etc/hysteria/config.yaml:ro
      - ./tls:/etc/hysteria/tls:ro
    ports:
      - "127.0.0.1:14443:443/udp"
    networks: [interop]

networks:
  interop:
