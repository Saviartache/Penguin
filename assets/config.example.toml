# Образец настроек Penguin.
#
# Скопируйте туда, куда указывает первая строка `penguin doctor`, и правьте под
# себя. Каталогов два: пока службы нет — профиль пользователя, после установки
# службы — общий (`%ProgramData%`), потому что служба работает от системной
# учётной записи и профиль пользователя ей не виден.
#
# Всё, что здесь есть, правится и мышью в окне. Файл нужен для другого: по нему
# видно целиком, что вообще можно настроить, — а в окне видно по одному экрану
# за раз.

version = 2

[app]
# Запускать окно при входе в систему.
autostart = false
# Поднимать тоннель сразу при запуске.
autoconnect = false
# `ru` или `en`. Читается один раз при запуске окна.
language = "ru"

[network]
# Блокировать весь трафик, пока тоннель не поднялся заново.
#
# Без этого разрыв соединения отправляет трафик напрямую, и заметить это можно
# далеко не сразу — а это ровно та ситуация, ради которой VPN и ставят.
kill_switch = true

# Принтер, роутер и соседние машины остаются доступны.
# Выключите, если в тоннель должно уходить и обращение к 192.168.x.x.
allow_lan = true

# Локальный прокси. Работает без прав администратора и без драйвера — с него
# и стоит начинать проверку.
[network.socks]
listen = "127.0.0.1:1080"

# ---------------------------------------------------------------- сервер ----

[[profiles]]
id   = "home"            # устойчивая ссылка; имя меняют, её — нет
name = "Домашний"

[profiles.outbound]
protocol = "hysteria2"

# `example.com:443` или диапазон портов: `example.com:20000-30000`.
# Диапазон включает смену порта на ходу — провайдер, ограничивающий скорость
# по пятёрке, каждый раз видит новое соединение.
server   = "example.com:443"
password = "пароль от сервера"

# Полоса. Ради неё протокол и существует: Brutal не подстраивается под потери,
# а держит заданную скорость.
#
# Это **настоящая** скорость вашего канала, а не «побольше значит побыстрее».
# Завышенное значение забивает очередь и добавляет задержку; заниженное просто
# не даёт того, за что заплачено.
[profiles.outbound.bandwidth]
up   = "50 mbps"
down = "200 mbps"

# Обфускация: без неё соединение выглядит обычным QUIC.
# Пароль общий с сервером.
# [profiles.outbound.obfs]
# type     = "salamander"
# password = "второй пароль, из настроек сервера"

# [profiles.outbound.tls]
# Имя для TLS, если оно отличается от адреса сервера.
# sni = "cdn.example.com"

# ------------------------------------------------------------- правила ------

[routing]
# full      — всё в тоннель, кроме описанного правилами
# allowlist — в тоннель только описанное правилами
# blocklist — в тоннель всё, кроме описанного
# off       — тоннель выключен, но правила продолжают разбираться
#
# Режим — это только умолчание для того, о чём правила молчат.
mode = "full"

# Правила разбираются по порядку: чем меньше `priority`, тем раньше.
# Первое совпавшее решает.

[[routing.rules]]
id     = "lan"
name   = "Локальная сеть никогда не в тоннель"
priority = -100
action = "direct"
when   = { dest_ip = ["10.0.0.0/8", "192.168.0.0/16", "127.0.0.0/8"] }

[[routing.rules]]
id       = "steam-content"
name     = "Патчи Steam — через тоннель"
priority = -10                    # раньше следующего правила
action   = "tunnel"
when.all = [
  { process_name = ["steam.exe"] },
  { domain_suffix = ["steamcontent.com"] },
]

[[routing.rules]]
id     = "games"
name   = "Игры мимо тоннеля"
action = "direct"
when.any = [
  { process_path_glob = ["C:/Games/**/*.exe"] },
  { process_name = ["steam.exe", "cs2.exe"] },
]

# Два правила выше — вместе — и есть то, ради чего нужно раздельное
# тоннелирование: игры идут напрямую (задержка), но их патчи качаются через
# тоннель (скорость). Проверить, что получилось:
#
#   penguin rules explain steamcontent.com:443 --process steam.exe
#   penguin rules explain 1.2.3.4:27015 --process steam.exe
