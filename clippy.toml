# Крейты нарезаны мелко намеренно; порог «слишком много аргументов» оставлен
# низким, чтобы длинная сигнатура сразу читалась как повод завести структуру.
too-many-arguments-threshold = 6
type-complexity-threshold = 250

# `unwrap_used`/`expect_used` включены ради горячего пути: там паника означает
# оборванное соединение. В тестах она означает провалившийся тест — то, чего от
# него и ждут, и обходить её `if let` значит писать тест, который молча
# проходит, когда разбор сломался.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
