[package]
name = "penguin-pingwin-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Сервер протокола Pingwin: HTTP/3 и HTTP/2, опознание, статическое прикрытие"

[[bin]]
name = "pingwin-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Формат провода — из протокола; сервер добавляет только сокеты и правила.
penguin-pingwin.workspace = true
penguin-core.workspace = true

# Сервер HTTP/3 (у клиента свой).
h3.workspace = true
h3-quinn.workspace = true
http.workspace = true
quinn = { workspace = true, features = ["rustls-ring", "runtime-tokio"] }
rustls = { workspace = true, features = ["ring", "std"] }
# Перенос по TCP: HTTP/2 поверх TLS.
h2.workspace = true
tokio-rustls.workspace = true

tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros", "signal", "fs"] }
bytes.workspace = true
serde.workspace = true
toml.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Сквозной тест поднимает и клиента.
penguin-proto.workspace = true
penguin-transport = { workspace = true, features = ["quic"] }
async-trait.workspace = true
serde_json.workspace = true
