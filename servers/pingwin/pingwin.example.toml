# Пример настроек сервера Pingwin.
#
#   pingwin-server keygen                        новая пара ключей
#   pingwin-server check --config pingwin.toml   проверить и выйти
#   pingwin-server run   --config pingwin.toml   слушать
#
# Открытый ключ, который печатает `keygen`, идёт в поле «Публичный ключ
# сервера» профиля клиента. Закрытый — сюда, в `key`.

# UDP и TCP: HTTP/3 и HTTP/2, как у любого сайта на 443. Где режут UDP,
# клиент идёт по TCP на тот же порт.
listen = "0.0.0.0:443"

# Закрытый ключ сервера, 32 байта в base64.
key = "замените: pingwin-server keygen"

# Сертификат на имя сервера — настоящий, например от Let's Encrypt: клиент
# проверяет его как обычно. Самоподписанный не пройдёт.
cert = "/etc/letsencrypt/live/vpn.example.com/fullchain.pem"
cert_key = "/etc/letsencrypt/live/vpn.example.com/privkey.pem"

# Каталог статического сайта: его видит тот, кто не прошёл опознание.
# Без него сервер отвечает `404` на всё.
cover = "/srv/cover"

# Пользователи. Пароль у каждого свой.
[[users]]
name = "petya"
password = "замените на длинный случайный пароль"
