# Пример настроек сервера Pingwin.
#
#   pingwin-server keygen                        новая пара ключей
#   pingwin-server check --config pingwin.toml   проверить и выйти
#   pingwin-server run   --config pingwin.toml   слушать
#
# Открытый ключ, который печатает `keygen`, идёт в поле «Публичный ключ
# сервера» профиля клиента. Закрытый — сюда, в `key`.

# Соединение выглядит TLS, и на 443 это удивило бы меньше всего. Но 443 и
# разбирают по дороге чаще всего: на проверочной линии он давал оборот в
# 135 мс против 0.9 мс на 9443. Если ваш провайдер к 443 равнодушен — ставьте
# 443, так незаметнее.
listen = "0.0.0.0:9443"

# Закрытый ключ сервера, 32 байта в base64.
key = "замените: pingwin-server keygen"

# Куда уходят соединения, которые не прошли опознание.
#
# Это должен быть настоящий веб-сервер — тот, на который можно зайти браузером
# и увидеть сайт. Тогда проверка сервера на прочность даёт ровно то же, что
# даёт заход на любой сайт, и отличить одно от другого нечем.
#
# Пусто — соединение закрывается. Так делать не стоит: сервер, закрывающий
# чужое соединение молча, отличим от обычного сайта, и по этому его находят.
fallback = "127.0.0.1:8080"

# Пользователи. Пароль у каждого свой: по нему выводятся ключи разговора, и
# без него пользователи одного сервера читали бы разговоры друг друга.
[[users]]
name = "petya"
password = "замените на длинный случайный пароль"
