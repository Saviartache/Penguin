# Сервер Pingwin.
#
#   docker compose run --rm --service-ports certbot certonly --standalone -d ИМЯ
#   bash renew.sh
#   docker compose up -d --build
#
# Прикрытие сервер отдаёт сам: каталог `cover/html` — статический сайт, который
# видит тот, кто не прошёл опознание.

services:
  pingwin:
    # Имя образа задано явно: под ним его зовут `keygen` и `link` — обе
    # команды работают без томов, то есть мимо compose.
    image: pingwin-server:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # QUIC — это UDP. Внутри контейнера порт непривилегированный, сервер
    # работает не под `root`; наружу — тот, что спросил `deploy.sh` (`.env`).
    ports:
      - "${PINGWIN_PORT:-443}:8443/udp"
    volumes:
      - ./pingwin.toml:/etc/pingwin/pingwin.toml:ro
      - ./certs:/etc/pingwin/certs:ro
      - ./cover/html:/srv/cover:ro
    environment:
      # `info` — опознанные клиенты. `debug` добавляет чужие соединения и
      # причины отказов.
      RUST_LOG: "info"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Выписывает и продлевает сертификат. Сам не запускается: его зовут
  # `deploy.sh` и `renew.sh`. Порт 80/tcp нужен только на время проверки имени.
  certbot:
    image: certbot/certbot:v3.0.1
    profiles: ["tools"]
    ports:
      - "80:80"
    volumes:
      - ./letsencrypt:/etc/letsencrypt
