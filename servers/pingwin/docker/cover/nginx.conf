# Прикрытие: обычный сайт, к которому уходят соединения, не прошедшие
# опознание.
#
# Ничего специального в нём нет и быть не должно — в этом весь смысл. Чем
# обычнее он выглядит, тем меньше поводов присматриваться к порту, на котором
# он отвечает.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Версию наружу не показываем: она не помогает никому, кроме того, кто
    # ищет уязвимость по версии.
    server_tokens off;

    location / {
        try_files $uri $uri/ =404;
    }
}
