# Корень workspace для сборки одного только сервера Pingwin.
#
# `stage.sh` кладёт этот файл в контекст сборки под именем `Cargo.toml`.
#
# Зачем отдельный, а не корневой: в корневом два десятка членов, и половина
# из них тянет `quinn`, `iced`, `smoltcp` и подмодуль с UI-китом. Серверу из
# всего этого не нужно ничего — ему нужны шесть крейтов и десяток внешних
# зависимостей, и собирать ради него весь клиент значит платить за это
# каждый раз, когда сервер надо пересобрать на месте.
#
# Список внешних зависимостей повторяет корневой **по значениям**: версии
# обязаны совпадать, иначе сервер соберётся с другим `ring` или другим
# `tokio`, чем клиент, и разойдётся с ним там, где этого никто не ждёт.
# Добавили зависимость крейту, который здесь собирается, — допишите её и
# сюда; сборка упадёт сразу, а не молча возьмёт другую версию.

[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/proto",
    "protocols/transport",
    "protocols/utls",
    "protocols/pingwin",
    "servers/pingwin",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Saviartache/penguin"
authors = ["Saviartache"]

[workspace.dependencies]
penguin-core = { path = "crates/core" }
penguin-proto = { path = "crates/proto" }
penguin-transport = { path = "protocols/transport" }
penguin-utls = { path = "protocols/utls" }
penguin-pingwin = { path = "protocols/pingwin" }

tokio = { version = "1", default-features = false }
async-trait = "0.1"

rustls = { version = "0.23", default-features = false }
rustls-platform-verifier = "0.5"
rustls-pemfile = "2"
ring = "0.17"
tokio-rustls = { version = "0.26", default-features = false }
md-5 = "0.11"
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets", "getrandom"] }
rand = "0.8"

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
bytes = "1"

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
